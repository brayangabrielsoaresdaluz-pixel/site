<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Roxo</title>

    <link rel="stylesheet"
          href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            background: linear-gradient(135deg, #16002b, #5a189a, #9d4edd);
        }

        /* Estrelas */
        .estrelas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 10% 20%, white, transparent),
                radial-gradient(2px 2px at 30% 70%, white, transparent),
                radial-gradient(2px 2px at 50% 15%, white, transparent),
                radial-gradient(2px 2px at 75% 40%, white, transparent),
                radial-gradient(2px 2px at 90% 80%, white, transparent),
                radial-gradient(1px 1px at 20% 45%, white, transparent),
                radial-gradient(1px 1px at 65% 85%, white, transparent),
                radial-gradient(2px 2px at 85% 15%, white, transparent);
            background-size: 250px 250px;
            animation: brilho 3s infinite alternate;
        }

        @keyframes brilho {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        /* Cartão */
        .formulario {
            position: relative;
            z-index: 1;
            width: 380px;
            max-width: 100%;
            padding: 35px;
            color: white;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .caixa-formulario {
            position: relative;
            margin-bottom: 22px;
        }

        .caixa-formulario input {
            width: 100%;
            height: 50px;
            padding: 0 45px 0 15px;
            color: white;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        .caixa-formulario input::placeholder {
            color: #eee;
        }

        .caixa-formulario input:focus {
            border-color: white;
        }

        .caixa-formulario i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 22px;
        }

        .caixa-lembrar-esqueci {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
            font-size: 12px;
        }

        .caixa-lembrar-esqueci label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .caixa-lembrar-esqueci a,
        .link-registro a {
            color: white;
            text-decoration: none;
        }

        .caixa-lembrar-esqueci a:hover,
        .link-registro a:hover {
            text-decoration: underline;
        }

        button {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 10px;
            background: white;
            color: #5a189a;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #e9d5ff;
            transform: translateY(-3px);
        }

        .link-registro {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
        }

        .link-registro a {
            font-weight: bold;
        }

        @media (max-width: 420px) {
            .formulario {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="estrelas"></div>

    <div class="formulario">
        <h1>Login</h1>

        <form>
            <div class="caixa-formulario">
                <input type="text" placeholder="Nome do usuário"
                       autocomplete="username" required>
                <i class="bx bx-user"></i>
            </div>

            <div class="caixa-formulario">
                <input type="password" placeholder="Senha"
                       autocomplete="current-password" required>
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="caixa-lembrar-esqueci">
                <label>
                    <input type="checkbox">
                    Lembrar-me
                </label>
                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit">Entrar</button>

            <p class="link-registro">
                Não tem conta? <a href="#">Registrar</a>
            </p>
        </form>
    </div>
</body>
</html>
